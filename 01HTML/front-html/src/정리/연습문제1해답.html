<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="btn">클릭하세요</button>
    <script>
      // [수정된 부분 1]
      // document.querySelector()는 CSS 선택자를 사용하므로, ID 선택자에는 '#'(샵) 기호를 붙여야 올바르게 요소를 찾을 수 있습니다.
      // const button = document.querySelector("btn"); // 오류: "btn" 태그를 찾음
      const button = document.querySelector("#btn"); // 수정: ID가 "btn"인 요소를 선택

      // [수정된 부분 2]
      // 사용자가 버튼을 '클릭'했을 때 동작하도록 요청했으므로, 이벤트 유형을 "mouseover" 대신 "click"으로 수정합니다.
      // button.addEventListener("mouseover", function () { // 오류: 마우스를 올렸을 때 동작
      button.addEventListener("click", function () { // 수정: 마우스를 클릭했을 때 동작
        console.log("버튼이 클릭되었습니다.");
      });
    </script>
  </body>
</html>
