- 요청 URL이 두가지이다.-> 원인

const NEWS_URL = "https://api.hnpwa.com/v0/news/1.json"
const CONTENT_URL = "https://api.hnpwa.com/v0/item/@id.json" 

- 함수 종류 
  - 제공되는 함수(API)
  - 사용자 정의 함수(custom)

반복되는 xhr 코드는 url 즉 호출하는 주소가 다르다.
getData할 때마다 주소를 새로 받아와야 한다. 
왜냐면 getData()가 그걸 알 수 없기 때문이다. 
함수를 만들고 그 함수가 할 일의 코드를 묶어주고 
그 코드가 동작되기 위한 입력 값을 정의해서 사용해주고 
그리고 함수의 처리 결과를 return으로 반환해주면 된다. 
이 함수는 두 군데의 사용처가 있다.
목록을 가져오는 URL과 hashchange 이벤트로 상세 정보를 가져오는 URL

function 함수이름(파라미터,,,,,){
  xhr.open()
  xhr.send()
}

function getData(url){
  xhr.open('GET', url, false)
  xhr.send()
  return JSON.parse(xhr.response)
}

JSON.parse -> string -> 객체 타입으로 변경해줌

하나만 더 생각해보자 
이 코드에서 원천이 하나인데 사용하는 곳이 여러군데가 된다면 
그 사용갯수에 따라 바뀌어야 하는 문제가 발생한다.
만일 id가 root가 아니라 other로 바뀌면 여러군데 모두를 수정해야한다. 
이 부분에 대해 생각해보자. 

즉 원천값(root 엘리먼트 id 문자열 'root')을 코드 여기저기 반복하면 
그 값이 바뀔때 (예: other나 home 등으로) 사용된 곳을 일일이 고쳐야 하는 
문제가 생긴다는 것이다. 

왜 문제가 될까?
document.querySelector('#root')처럼 문자열 'root'를 직접 박아 넣은 것이 문제다.
이 문자열이 여러 곳에 흩어져 있으면 HTML에서 id='home' 으로 바꾸는 순간 코드와
모든 root를 찾아서 수정해야 함. 
찾다가 하나라도 놓치면 런타임에서 null이 떨어지고 appendChild같은 곳에서 
TypeError가 터진다. 

원칙: Single Source of Truth
원천이 하나면 그 원천을 딱 한 곳에만 적어두고 나머지는 그 값을 참조하자는 원칙임
즉 한 군데만 고치면 전체가 다 적용된다는 것이다.
