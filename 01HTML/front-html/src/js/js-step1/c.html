<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // html 문서 전체를 받아주는 객체를 설계했는데 - document는 내장객체
    // 별도로 생성하지 않고 바로 사용이 가능하다 - 즉 null, undefined
    // 객체들은 속성과 함수로 구성되어 있다. 
    // document가 제공하는 함수에 write 포함됨 
    // write함수의 파라미터 자리에는 문자열만 올 수 있다. 
    // 문자열은 태그였다. 
    document.write("<div>")
    document.write("Hello DOM API")
    document.write("</div>")
  </script>
  <div></div>
</body>
</html>
